services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  gabe-knowledge-engine:
    build:
      context: ./services/gabe-knowledge-engine
    env_file:
      - ./services/gabe-knowledge-engine/.env.example
    ports:
      - "4100:4100"
    volumes:
      - /var/lib/gabe/manuals:/var/lib/gabe/manuals
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  qdrant_data:
