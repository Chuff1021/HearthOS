services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  gabe-knowledge-engine:
    build:
      context: ./services/gabe-knowledge-engine
    env_file:
      - ./services/gabe-knowledge-engine/.env.example
    ports:
      - "4100:4100"
    volumes:
      - /var/lib/gabe/manuals:/var/lib/gabe/manuals
    depends_on:
      - qdrant

  gabe-orchestrator:
    build:
      context: .
      dockerfile: ./services/gabe-orchestrator/Dockerfile
    env_file:
      - ./services/gabe-orchestrator/.env.example
    ports:
      - "4200:4200"
    depends_on:
      - gabe-knowledge-engine

volumes:
  qdrant_data:
