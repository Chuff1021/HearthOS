name: CRM stabilization checks

on:
  pull_request:
  push:
    branches: [main, codex/aarons-crm-stabilization]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build
